# Nombre de réplicas de l'application (peut être ajusté ou géré par le HPA)
replicaCount: 2

image:
  repository: traefik/whoami
  tag: "latest"
  pullPolicy: IfNotPresent
replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

probes:
  livenessPath: /healthz
  readinessPath: /ready