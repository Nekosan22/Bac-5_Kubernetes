# Nombre de réplicas de l'application (peut être ajusté ou géré par le HPA)
replicaCount: 2

image:
  # Nom du registre et de l'image de votre application de billetterie[cite: 1]
  repository: localhost/gabictator-api
  pullPolicy: Never
  # Tag initial de l'image (à modifier pour déclencher les mises à jour GitOps)[cite: 1]
  tag: "0.1.1"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

probes:
  livenessPath: /health/live
  readinessPath: /health/ready
