apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "billetterie.fullname" . }}
  namespace: billetterie
  labels:
    app.kubernetes.io/name: billetterie
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: billetterie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billetterie
    spec:
      containers:
        - name: billetterie
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi