apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "billetterie.fullname" . }}
  namespace: billetterie
  labels:
    app.kubernetes.io/name: billetterie
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: billetterie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billetterie
    spec:
      containers:
        - name: billetterie
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi