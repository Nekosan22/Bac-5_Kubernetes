apiVersion: v1
kind: Service
metadata:
  name: {{ include "billetterie.fullname" . }}
  namespace: billetterie
  labels:
    app.kubernetes.io/name: billetterie
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: billetterie