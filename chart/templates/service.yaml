apiVersion: v1
kind: Service
metadata:
  name: {{ include "billetterie.fullname" . }}
  namespace: billetterie
  labels:
    app.kubernetes.io/name: billetterie
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: billetterie
