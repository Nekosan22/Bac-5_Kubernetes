apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: billetterie-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Nekosan22/Bac-5_Kubernetes.git'
    targetRevision: HEAD
    path: chart # Dossier de votre chart Helm dans le dépôt
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: billetterie
  syncPolicy:
    automated:
      prune: true
      selfHeal: true